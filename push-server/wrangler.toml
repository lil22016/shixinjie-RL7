name = "shixinjie-push"
main = "src/worker.js"
compatibility_date = "2026-01-01"

[vars]
# 允许调用本服务的网站来源（逗号分隔，不要带结尾的 /）
ALLOWED_ORIGINS = "https://lil22016.github.io"
VAPID_SUBJECT = "mailto:admin@example.com"
# VAPID_PUBLIC_KEY 和 VAPID_PRIVATE_KEY 用 `npx wrangler secret put` 设置，不要写在这里

[[durable_objects.bindings]]
name = "PUSH_CLIENT"
class_name = "PushClient"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushClient"]
