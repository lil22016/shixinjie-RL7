<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#24192d"><title>Private Frequency</title><link rel="stylesheet" href="css/nyx-control.css?v=20260917v32"><link rel="stylesheet" href="css/nyx-control-v33.css?v=20260918v33"><link rel="stylesheet" href="css/nyx-speech-v3.css?v=20260917v32"></head><body><main class="nyx-shell"><header class="nyx-header"><button class="back-btn" onclick="history.back()">‹</button><div><div class="eyebrow">PRIVATE FREQUENCY</div><h1>Control</h1></div><div class="connection-pill"><span id="statusDot" class="status-dot"></span><span id="connectionText">Offline</span></div></header><section class="connect-line"><button id="connectBtn" class="connect-btn">Connect Nyx</button><div id="browserWarning" class="warning hidden">Open this page in Bluefy to use Web Bluetooth.</div></section><section class="control-card"><div class="readout-label">CURRENT INTENSITY</div><div class="intensity-readout"><span id="intensityValue">0</span><small>%</small></div><div class="owner-line">Loki has the controls.</div><div class="session-actions"><button id="startBtn" class="session-btn start">Start</button><button id="stopBtn" class="session-btn stop">Stop</button></div><input id="intensitySlider" type="range" min="0" max="100" value="0" step="1"><div class="preset-grid"><button data-level="0">0</button><button data-level="10">10</button><button data-level="25">25</button><button data-level="50">50</button><button data-level="75">75</button><button data-level="100">100</button></div></section><section class="log-card"><div class="log-head"><span>ACTIVITY LOG</span><span class="live-dot">LIVE</span></div><div id="activityLog" class="activity-log"></div></section></main><div id="nyxQuestion" class="nyx-question-overlay"><div class="nyx-question-card"><div class="nyx-q-kicker">LOKI ASKS</div><div class="nyx-q-text"></div><div class="nyx-q-actions"><button class="nyx-q-btn"></button><button class="nyx-q-btn"></button></div></div></div><div id="countdownOverlay" class="countdown-overlay"><div id="countdownNumber" class="countdown-number">3</div></div><script src="js/nyx-control.js?v=20260918v33"></script></body></html>
