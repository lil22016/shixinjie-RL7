<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#24192d">
<title>Private Frequency</title>
<link rel="stylesheet" href="css/nyx-control.css?v=20260917pf2">
<link rel="stylesheet" href="css/nyx-speech-v3.css?v=20260917v3">
</head>
<body>
<main class="nyx-shell">
<header class="nyx-header">
<button class="back-btn" onclick="history.back()" aria-label="Back">‹</button>
<div><div class="eyebrow">PRIVATE FREQUENCY</div><h1>Control</h1></div>
<div class="connection-pill"><span id="statusDot" class="status-dot"></span><span id="connectionText">Offline</span></div>
</header>

<section class="connect-line">
<button id="connectBtn" class="connect-btn">Connect Nyx</button>
<div id="browserWarning" class="warning hidden">Open this page in Bluefy to use Web Bluetooth.</div>
</section>

<section class="control-card">
<div class="readout-label">CURRENT INTENSITY</div>
<div class="intensity-readout"><span id="intensityValue">0</span><small>%</small></div>
<div class="owner-line">Loki has the controls.</div>
<input id="intensitySlider" type="range" min="0" max="100" value="0" step="1">
<div class="preset-grid">
<button data-level="0">0</button><button data-level="10">10</button><button data-level="25">25</button>
<button data-level="50">50</button><button data-level="75">75</button><button data-level="100">100</button>
</div>
</section>

<section class="log-card">
<div class="log-head"><span>ACTIVITY LOG</span><span class="live-dot">LIVE</span></div>
<div id="activityLog" class="activity-log"></div>
</section>
</main>
<script src="js/nyx-control.js?v=20260917pf2"></script>
</body></html>
